<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cdn.sheshenin.com</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        h1 {
            font-size: 2.5rem;
            color: #ff6b35;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.1rem;
            color: #888;
            line-height: 1.6;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #1a1a2e;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>sheshenin.com</h1>
        <p>Hosting platform</p>
        <div class="status">
            <span class="dot"></span> Online
        </div>
    </div>
</body>
</html>

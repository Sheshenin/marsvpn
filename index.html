<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarsVPN</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
        }
        h1 {
            font-size: 3rem;
            color: #ff6b35;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            color: #888;
        }
        .status {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: #1a1a2e;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #4caf50;
            border-radius: 50%;
            margin-right: 8px;
        }
        .config {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: #1a1a2e;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: left;
            font-size: 0.9rem;
        }
        .config h3 {
            color: #ff6b35;
            margin-bottom: 1rem;
            text-align: center;
        }
        .config-row {
            display: flex;
            justify-content: space-between;
            padding: 0.4rem 0;
            border-bottom: 1px solid #222;
        }
        .config-row:last-child { border-bottom: none; }
        .label { color: #888; }
        .value { color: #e0e0e0; font-family: monospace; }
        .note {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MarsVPN</h1>
        <p>Secure connection to the Red Planet</p>
        <div class="status">
            <span class="dot"></span> Server is running
        </div>
        <div class="config">
            <h3>Shadowrocket Config</h3>
            <div class="config-row">
                <span class="label">Type</span>
                <span class="value">Shadowsocks</span>
            </div>
            <div class="config-row">
                <span class="label">Address</span>
                <span class="value">&lt;SERVER_IP&gt;</span>
            </div>
            <div class="config-row">
                <span class="label">Port</span>
                <span class="value">8388</span>
            </div>
            <div class="config-row">
                <span class="label">Encryption</span>
                <span class="value">aes-256-gcm</span>
            </div>
            <div class="config-row">
                <span class="label">Password</span>
                <span class="value">see config</span>
            </div>
        </div>
        <p class="note">Shadowrocket &rarr; Add Server &rarr; Shadowsocks</p>
    </div>
</body>
</html>

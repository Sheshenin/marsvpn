services:
  app:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  shadowsocks:
    image: ghcr.io/shadowsocks/ssserver-rust:latest
    ports:
      - "8388:8388/tcp"
      - "8388:8388/udp"
    volumes:
      - ./shadowsocks/config.json:/etc/shadowsocks-rust/config.json:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

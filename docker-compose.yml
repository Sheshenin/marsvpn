services:
  app:
    build: .
    restart: unless-stopped
    networks:
      - proxy_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marsvpn.rule=Host(`cdn.sheshenin.com`)"
      - "traefik.http.routers.marsvpn.entrypoints=websecure"
      - "traefik.http.routers.marsvpn.tls=true"
      - "traefik.http.routers.marsvpn.tls.certresolver=le"
      - "traefik.http.services.marsvpn.loadbalancer.server.port=80"

  tasks-api:
    build:
      context: .
      dockerfile: tasks/Dockerfile
    restart: unless-stopped
    volumes:
      - tasks-data:/app/data
    environment:
      - TASKS_API_TOKEN=${TASKS_API_TOKEN:-}
      - TASKS_DB_PATH=/app/data/tasks.db
    networks:
      - proxy_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tasks.rule=Host(`tasks.sheshenin.com`)"
      - "traefik.http.routers.tasks.entrypoints=websecure"
      - "traefik.http.routers.tasks.tls=true"
      - "traefik.http.routers.tasks.tls.certresolver=le"
      - "traefik.http.services.tasks.loadbalancer.server.port=8000"

volumes:
  tasks-data:

networks:
  proxy_default:
    external: true

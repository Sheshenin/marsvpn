name: Deploy to VPS
# trigger redeploy

on:
  push:
    branches:
      - claude/setup-cicd-autodeploy-A79xr

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/deploy/projects/marsvpn && git pull https://${{ secrets.GH_PAT }}@github.com/Sheshenin/marsvpn.git claude/setup-cicd-autodeploy-A79xr && docker compose up -d --build

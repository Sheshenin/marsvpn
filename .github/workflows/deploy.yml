name: Deploy to VPS

on:
  push:
    branches:
      - claude/setup-cicd-autodeploy-A79xr

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            REPO_DIR="$HOME/app/marsvpn"
            REPO_URL="https://${{ secrets.GH_PAT }}@github.com/Sheshenin/marsvpn.git"
            BRANCH="claude/setup-cicd-autodeploy-A79xr"

            mkdir -p "$HOME/app"

            if [ -d "$REPO_DIR" ]; then
              rm -rf "$REPO_DIR"
            fi

            git clone -b "$BRANCH" "$REPO_URL" "$REPO_DIR"
            cd "$REPO_DIR"
            docker compose up -d --build

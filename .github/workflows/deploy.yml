name: Deploy to VPS

on:
  push:
    branches:
      - claude/setup-cicd-autodeploy-A79xr

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check secrets are set
        run: |
          missing=""
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then missing="$missing SERVER_HOST"; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then missing="$missing SERVER_USER"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then missing="$missing SSH_PRIVATE_KEY"; fi
          if [ -z "${{ secrets.GH_PAT }}" ]; then missing="$missing GH_PAT"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing"
            exit 1
          fi
          echo "All secrets are set"
          echo "HOST length: ${#HOST_VAL} chars"
          echo "USER value: ${{ secrets.SERVER_USER }}"
          echo "KEY first line: $(echo '${{ secrets.SSH_PRIVATE_KEY }}' | head -1)"
        env:
          HOST_VAL: ${{ secrets.SERVER_HOST }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            sudo chown -R deploy:deploy /home/deploy/projects/marsvpn
            git config --global --add safe.directory /home/deploy/projects/marsvpn
            cd /home/deploy/projects/marsvpn
            git pull https://${{ secrets.GH_PAT }}@github.com/Sheshenin/marsvpn.git claude/setup-cicd-autodeploy-A79xr
            docker compose -f docker-compose.yml up -d --build
